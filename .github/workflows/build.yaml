name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev desktop-file-utils libgdk-pixbuf2.0-dev libmpv-dev libepoxy-dev librsvg2-dev libgirepository1.0-dev
        shell: bash

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          mkdir -p release
          
          # Check if bundle directory exists
          if [ ! -d "build/linux/x64/release/bundle" ]; then
            echo "Error: bundle directory not found"
            ls -la build/linux/x64/release/
            exit 1
          fi
          
          # Create tar.gz archive of the Linux build
          tar -czf release/CCloud-linux.tar.gz -C build/linux/x64/release bundle/
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/CCloud-linux.tar.gz
  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Get tag name
        id: get_tag
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ':' -f 2 | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Create Release
        id: create_release 
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            CCloud-linux.tar.gz
          body: |            
            ## CCloud Release ${{ env.TAG_NAME }}
            
            ### Download
            
            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Linux    | x64 (tar.gz) | <a href="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/CCloud-linux.tar.gz"><img src="https://img.shields.io/badge/Linux-tar.gz-FCC624?style=for-the-badge&logo=linux&logoColor=black" alt="Linux tar.gz"></a> |
            
            For detailed instructions on installing and running CCloud on Linux, please refer to our [Linux Installation Guide](https://github.com/${{ github.repository }}/blob/master/assets/LINUX_INSTALL.md).
